services:
  - type: web
    name: sales-inbox-router-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CANDIDATE_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_URL
        sync: false
      - key: KEEPALIVE_INTERVAL_MS
        value: "600000"
